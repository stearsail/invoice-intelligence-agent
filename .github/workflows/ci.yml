name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Importing invoice_pipeline.workflow constructs the extractor clients at module
      # level, so these must be present for collection — no real calls are made.
      POSTGRES_PASSWORD: dummy
      POSTGRES_HOST: localhost
      ANTHROPIC_API_KEY: dummy
      VLLM_BASE_URL: http://localhost:8000/v1
      VLLM_API_KEY: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest