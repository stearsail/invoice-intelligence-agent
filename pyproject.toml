[project]
name = "invoice-pipeline"
version = "0.1.0"
description = "An invoice-processing pipeline: a fine-tuned small vision-language model (served via vLLM) extracts structured data from invoices/receipts, with validation, reconciliation, fallback to a frontier model, and a reviewable ledger."
readme = "README.md"
authors = [
    { name = "Stephen", email = "stearsail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "arq>=0.28.0",
    "fastapi[standard]>=0.139.0",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langgraph>=1.2.8",
    "mlflow>=3.14.0",
    "openai>=2.44.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
]

[project.scripts]
invoice-pipeline = "invoice_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "jupyter>=1.1.1",
    "modal>=1.5.2",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "streamlit>=1.60.0",
]
train = [
    "datasets>=4.3.0",
    "mlflow>=3.14.0",
    "psutil>=7.2.2",
    "transformers==4.57.1",
    "trl>=0.24.0",
    "unsloth>=2026.5.2",
    "vllm>=0.19.1",
]

[tool.fastapi]
entrypoint = "invoice_pipeline.api.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["alembic/versions"]
