[project]
name = "invoice-agent"
version = "0.1.0"
description = "An invoice-processing agent: a fine-tuned small LLM (served via vLLM) extracts structured data from invoices/receipts, wrapped in a Pydantic AI agent with validation, fallback to a frontier model, a ledger, and observability."
readme = "README.md"
authors = [
    { name = "Stephen", email = "stearsail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi[standard]>=0.139.0",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langgraph>=1.2.8",
    "mlflow>=3.14.0",
    "openai>=2.44.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
]

[project.scripts]
invoice-agent = "invoice_agent:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
train = [
    "datasets>=4.3.0",
    "mlflow>=3.14.0",
    "transformers==4.57.1",
    "trl>=0.24.0",
    "unsloth>=2026.5.2",
    "vllm>=0.19.1",
]

[tool.fastapi]
entrypoint = "invoice_agent.api.main:app"
